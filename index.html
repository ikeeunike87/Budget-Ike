<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>💖 Personal Budget Tracker</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial; }
  </style>
</head>
<body class="min-h-screen bg-slate-50 p-4 md:p-8 text-slate-800">

  <div class="max-w-4xl mx-auto space-y-6">
    
    <!-- Header -->
    <header class="text-center space-y-1">
      <h1 class="text-2xl md:text-3xl font-bold text-slate-900">💖 Personal Budget Tracker ✨</h1>
      <p class="text-sm text-slate-500">Kelola keuanganmu dari mana saja 📱💻</p>
    </header>

    <!-- Summary Cards -->
    <div id="summary" class="grid grid-cols-2 md:grid-cols-4 gap-3 md:gap-4"></div>

    <!-- Form Input Transaksi -->
    <form id="form" class="bg-white p-4 md:p-6 rounded-xl shadow-sm border-slate-100 space-y-4">
      <h2 class="text-base font-semibold text-slate-700">➕ Tambah Transaksi Baru</h2>
      <div class="grid grid-cols-1 md:grid-cols-4 gap-3">
        <select id="category" class="p-2.5 bg-slate-50 border-slate-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
          <option value="income">💵 Pemasukan</option>
          <option value="investment">🌱 Investasi</option>
          <option value="expense">🛍️ Pengeluaran</option>
        </select>
        <input id="title" type="text" placeholder="Deskripsi (misal: ☕ Kopi)" class="p-2.5 bg-slate-50 border-slate-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500" required>
        <input id="amount" type="number" placeholder="Nominal (Rp)" class="p-2.5 bg-slate-50 border-slate-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500" required>
        <button type="submit" class="p-2.5 bg-indigo-600 hover:bg-indigo-700 text-white font-medium rounded-lg text-sm transition">Simpan ✨</button>
      </div>
    </form>

    <!-- Breakdown List -->
    <div id="lists" class="grid grid-cols-1 md:grid-cols-3 gap-4"></div>

  </div>

<script>
  // Data Awal
  let incomes = [
    { id: 1, name: '💼 Gaji Utama', amount: 8000000 },
    { id: 2, name: '🎨 Side Project', amount: 1500000 },
  ];
  let investments = [
    { id: 1, name: '📈 Reksadana / Saham', amount: 1500000 },
    { id: 2, name: '🛡️ Dana Darurat', amount: 500000 },
  ];
  let expenses = [
    { id: 1, name: '🏠 Kost & Tagihan', amount: 2000000 },
    { id: 2, name: '🍲 Makan Harian', amount: 1800000 },
    { id: 3, name: '☕ Ngopi & Nongkrong', amount: 500000 },
  ];

  const form = document.getElementById('form');
  const category = document.getElementById('category');
  const title = document.getElementById('title');
  const amount = document.getElementById('amount');

  const formatRupiah = (number) => {
    return new Intl.NumberFormat('id-ID', {
      style: 'currency',
      currency: 'IDR',
      maximumFractionDigits: 0,
    }).format(number);
  };

  function render() {
    // Hitung Total
    const totalIncome = incomes.reduce((acc, curr) => acc + Number(curr.amount), 0);
    const totalInvestment = investments.reduce((acc, curr) => acc + Number(curr.amount), 0);
    const totalExpense = expenses.reduce((acc, curr) => acc + Number(curr.amount), 0);
    const remainingBalance = totalIncome - (totalInvestment + totalExpense);

    // Render Summary
    document.getElementById('summary').innerHTML = `
      <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-100">
        <span class="text-xs text-slate-400 font-medium">Total Pemasukan</span>
        <p class="text-base md:text-lg font-bold text-emerald-600 mt-1">${formatRupiah(totalIncome)}</p>
      </div>
      <div class="bg-white p-4 rounded-xl shadow-sm border-slate-100">
        <span class="text-xs text-slate-400 font-medium">Total Investasi</span>
        <p class="text-base md:text-lg font-bold text-blue-600 mt-1">${formatRupiah(totalInvestment)}</p>
      </div>
      <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-100">
        <span class="text-xs text-slate-400 font-medium">Total Pengeluaran</span>
        <p class="text-base md:text-lg font-bold text-rose-500 mt-1">${formatRupiah(totalExpense)}</p>
      </div>
      <div class="bg-white p-4 rounded-xl shadow-sm border-slate-100">
        <span class="text-xs text-slate-400 font-medium">Sisa Saldo</span>
        <p class="text-base md:text-lg font-bold mt-1 ${remainingBalance >= 0 ? 'text-indigo-600' : 'text-rose-600'}">${formatRupiah(remainingBalance)}</p>
      </div>
    `;

    // Render Lists
    document.getElementById('lists').innerHTML = `
      ${renderList('Pemasukan', 'income', incomes, 'text-emerald-700')}
      ${renderList('Investasi', 'investment', investments, 'text-blue-700')}
      ${renderList('Pengeluaran', 'expense', expenses, 'text-rose-600')}
    `;
  }

  function renderList(label, type, data, color) {
    const icons = {income: '💵', investment: '🌱', expense: '🛍️'}
    return `
    <div class="bg-white p-4 rounded-xl shadow-sm border-slate-100">
      <h3 class="font-semibold ${color} mb-3 border-b pb-2">${icons[type]} ${label}</h3>
      <ul class="space-y-2">
        ${data.map(item => `
          <li class="flex justify-between items-center text-sm p-2 hover:bg-slate-50 rounded-lg">
            <span>${item.name}</span>
            <div class="flex items-center gap-2">
              <span class="font-medium text-slate-700">${formatRupiah(item.amount)}</span>
              <button onclick="removeItem(${item.id}, '${type}')" class="text-slate-400 hover:text-rose-500">✕</button>
            </div>
          </li>
        `).join('')}
      </ul>
    </div>
    `
  }

  function removeItem(id, type) {
    if (type === 'income') incomes = incomes.filter((item) => item.id !== id);
    if (type === 'investment') investments = investments.filter((item) => item.id !== id);
    if (type === 'expense') expenses = expenses.filter((item) => item.id !== id);
    render();
  }

  form.addEventListener('submit', (e) => {
    e.preventDefault();
    if (!title.value || !amount.value) return;
    const newItem = { id: Date.now(), name: title.value, amount: Number(amount.value) };
    if (category.value === 'income') incomes.push(newItem);
    else if (category.value === 'investment') investments.push(newItem);
    else if (category.value === 'expense') expenses.push(newItem);
    title.value = '';
    amount.value = '';
    render();
  });

  // Load pertama kali
  render();
</script>

</body>
</html>
